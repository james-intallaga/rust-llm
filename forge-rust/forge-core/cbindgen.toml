# cbindgen configuration for forge-core
# Generates C headers for Swift interop

language = "C"
header = "/* Auto-generated by cbindgen. Do not edit. */"
include_guard = "FORGE_FFI_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Don't modify this manually. */"
line_length = 100

# Style
style = "both"
cpp_compat = true
documentation = true
documentation_style = "c99"

# Export settings
[export]
prefix = ""
include = ["ForgeResult", "ForgeParams", "ForgeHandle", "TokenCallback"]
exclude = ["ForgeEngine", "ForgeConfig"]

[export.rename]
# Keep FFI names as-is

[parse]
parse_deps = false
include = ["forge-core"]
extra_bindings = []

# Note: [parse.expand] requires nightly compiler, so we skip it
# The FFI types in ffi.rs are designed to work without macro expansion

[enum]
rename_variants = "None"
add_sentinel = false
prefix_with_name = true

[fn]
rename_args = "None"
must_use = "FORGE_NODISCARD"

[struct]
rename_fields = "None"
must_use = "FORGE_NODISCARD"

[defines]
"target_os = ios" = "FORGE_IOS"
"target_os = macos" = "FORGE_MACOS"

[macro_expansion]
bitflags = true
