name: Verify

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-and-docs:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - run: ./scripts/check-release.sh
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - run: ./build-xcframework.sh
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
        working-directory: forge-rust
      - run: cargo fmt --all --check
        working-directory: forge-rust
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: forge-rust
      - run: cargo test --workspace --all-targets --no-fail-fast
        working-directory: forge-rust
      - run: python3 -m pip install 'mkdocs==1.6.1' 'mkdocs-material==9.6.14'
      - run: python3 -m mkdocs build --strict

  android:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android,x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: ./forge-rust/scripts/build-android.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
      - run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
        working-directory: example-android
